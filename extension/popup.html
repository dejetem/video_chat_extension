<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Rust Video Chat</title>
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            margin: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .logo {
            width: 64px;
            height: 64px;
        }

        h1 {
            font-size: 1.2rem;
            margin: 0;
            background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #3a7bd5;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        button:hover {
            background: #00d2ff;
            transform: translateY(-2px);
        }

        .status {
            font-size: 0.8rem;
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="icons/icon128.png" alt="Logo" class="logo">
        <h1>Video Chat</h1>
        <div class="status">Status: Ready</div>
        <button id="startRoom">Create New Room</button>
        <button id="joinRoom">Join Existing Room</button>
    </div>
    <script src="popup.js"></script>
</body>

</html>
