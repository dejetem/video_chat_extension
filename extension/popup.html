<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust Video Chat</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="header">
        <div class="logo-info">
            <img src="icons/icon48.png" alt="Logo" class="logo-small">
            <h1>Rust Video Chat</h1>
        </div>
        <div id="connectionStatus" class="status">Disconnected</div>
    </div>

    <div class="controls-bar">
        <button id="toggleMic" class="icon-btn active" title="Toggle Mic">
            <span id="micIcon">🎤</span>
        </button>
        <button id="toggleCam" class="icon-btn active" title="Toggle Camera">
            <span id="camIcon">📷</span>
        </button>
        <button id="toggleScreen" class="icon-btn" title="Share Screen">
            <span>🖥️</span>
        </button>
        <div style="flex-grow: 1;"></div>
        <button id="leaveRoom" class="icon-btn off" title="Leave Room">
            <span>📞</span>
        </button>
    </div>

    <div class="room-controls"
        style="padding: 10px; border-bottom: 1px solid var(--border-color); display: flex; gap: 8px; background: rgba(255,255,255,0.02);">
        <input type="text" id="roomIdInput" placeholder="Room ID (e.g. default)"
            style="flex: 1; background: #222; border: 1px solid #444; color: white; padding: 6px 12px; border-radius: 4px; outline: none;">
        <button id="joinRoomBtn"
            style="background: var(--accent-color); border: none; color: black; font-weight: bold; padding: 0 12px; border-radius: 4px; cursor: pointer;">Join</button>
    </div>

    <div id="chatArea" class="chat-area">
        <!-- Messages will be injected here -->
        <div class="message received">Enter a Room ID and click Join to start a call.</div>
    </div>

    <div class="input-area">
        <textarea id="messageInput" rows="2" placeholder="Type a message..."></textarea>
        <div class="actions">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
