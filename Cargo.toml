[workspace]
members = [
    "crates/core",
    "crates/signaling",
    "crates/wasm",
    "crates/media",
    "crates/sfu-client",
    "crates/sfu-server",
]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "deny"
# missing_docs = "warn"

[workspace.lints.clippy]
all = "deny"
# pedantic = "warn"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Simon Jonathan <enyejonathansimon@yahoo.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dejetem/video_chat_extension.git"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
log = "0.4"
wasm-logger = "0.2"

# Async
tokio = { version = "1.0", features = ["full"] }
wasm-bindgen-futures = "0.4"

# WASM
wasm-bindgen = "0.2"
web-sys = "0.3"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

# Testing
mockall = "0.12"
proptest = "1.0"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations
panic = "abort"     # Abort on panic
strip = true        # Strip symbols from binary

[profile.release.package."*"]
opt-level = "z"
